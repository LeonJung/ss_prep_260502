[Interface]
# PC c — private key 자리.
# /etc/wireguard/c_priv 내용으로 교체:
#   sudo sed -i "s|__PASTE_C_PRIV_HERE__|$(sudo cat /etc/wireguard/c_priv)|" /etc/wireguard/wg0.conf
PrivateKey = __PASTE_C_PRIV_HERE__

# 터널 내부 IP — c 측
Address = 10.99.0.2/30
ListenPort = 51820

# 라우팅 + FORWARD ACCEPT
# d-facing iface 이름: enx9cebe8606e07
PostUp   = ip route add 10.42.0.0/24 via 10.99.0.1 dev %i; iptables -I FORWARD -i %i -o enx9cebe8606e07 -j ACCEPT; iptables -I FORWARD -i enx9cebe8606e07 -o %i -j ACCEPT
PostDown = ip route del 10.42.0.0/24 via 10.99.0.1 dev %i 2>/dev/null; iptables -D FORWARD -i %i -o enx9cebe8606e07 -j ACCEPT 2>/dev/null; iptables -D FORWARD -i enx9cebe8606e07 -o %i -j ACCEPT 2>/dev/null

[Peer]
# PC b 의 public key (사용자 제공, 2026-05-13)
PublicKey = aUfSpkNKsXyt5584f1RH8Mqnnd0nq5Vy+PefvChXKG0=

# b 의 corp-side IP (10.222.68.241) 가 c 쪽에서 reachable 한지 불확실 →
# Endpoint 명시 안 함. b 가 initiate 후 conntrack 으로 응답 경로 자동.

# 터널 내부 b IP + 그 너머 a-facing 서브넷
AllowedIPs = 10.42.0.0/24, 10.99.0.1/32

# 양쪽 모두 keepalive (대칭 안정성)
PersistentKeepalive = 25
