[Interface]
# PC b — private key 자리.
# /etc/wireguard/b_priv 내용으로 교체:
#   sudo sed -i "s|__PASTE_B_PRIV_HERE__|$(sudo cat /etc/wireguard/b_priv)|" /etc/wireguard/wg0.conf
PrivateKey = __PASTE_B_PRIV_HERE__

# 터널 내부 IP — b 측
Address = 10.99.0.1/30
ListenPort = 51820

# 라우팅 + FORWARD ACCEPT (재기동 후에도 자동)
# a-facing iface 이름: enx9cebe8ce7665
PostUp   = ip route add 10.42.2.0/24 via 10.99.0.2 dev %i; iptables -I FORWARD -i %i -o enx9cebe8ce7665 -j ACCEPT; iptables -I FORWARD -i enx9cebe8ce7665 -o %i -j ACCEPT
PostDown = ip route del 10.42.2.0/24 via 10.99.0.2 dev %i 2>/dev/null; iptables -D FORWARD -i %i -o enx9cebe8ce7665 -j ACCEPT 2>/dev/null; iptables -D FORWARD -i enx9cebe8ce7665 -o %i -j ACCEPT 2>/dev/null

[Peer]
# PC c 의 public key (사용자 제공, 2026-05-13)
# base64 길이 한 글자 짧을 가능성 — handshake 실패시 c에서 `cat /etc/wireguard/c_pub` 다시 확인
PublicKey = g4osTCqyfyD9k+98ub7RiuI6UMAfoqjRMqW+rMlqhM=

# c 의 corp-facing public IP (b 가 initiate)
Endpoint = 12.56.52.76:51820

# 터널 내부 c IP + 그 너머 d-facing 서브넷
AllowedIPs = 10.42.2.0/24, 10.99.0.2/32

# conntrack hole 유지 (b 단방향 initiate 환경 대응)
PersistentKeepalive = 25
